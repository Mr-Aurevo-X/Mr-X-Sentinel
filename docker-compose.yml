services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mrx
      POSTGRES_PASSWORD: mrx
      POSTGRES_DB: sentinel
    ports:
      - "5433:5432"
    volumes:
      - sentinel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrx -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sentinel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: sentinel-lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    depends_on:
      - redis

  brain:
    build:
      context: ./services/brain
      dockerfile: Dockerfile
    container_name: sentinel-brain
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      BRAIN_API_KEY: ${BRAIN_API_KEY:-dev-brain-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  sentinel_pg_data:
  sentinel_redis_data:
